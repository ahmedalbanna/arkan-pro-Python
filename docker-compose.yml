version: "3.9"
services:
  api:
    build: .
    environment:
      - ENV=dev
      - APP_NAME=arkan-backend
      - JWT_SECRET_KEY=dev-secret
      - CORS_ALLOW_ORIGINS=["http://localhost:3000","*"]
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
